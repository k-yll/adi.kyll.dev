<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .glow-effect {
            text-shadow: 0 0 60px rgba(99, 102, 241, 0.4), 0 0 100px rgba(168, 85, 247, 0.3);
        }

        /* Subtle ambient movement */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Gradient blob animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        .animate-blob {
            animation: blob 8s infinite alternate ease-in-out;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center overflow-hidden relative selection:bg-indigo-500 selection:text-white">

    <!-- Ambient background glows -->
    <div class="absolute top-1/4 left-1/3 w-72 h-72 md:w-96 md:h-96 bg-indigo-600/30 rounded-full blur-3xl pointer-events-none animate-blob"></div>
    <div class="absolute bottom-1/4 right-1/3 w-72 h-72 md:w-96 md:h-96 bg-purple-600/30 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-2000"></div>

    <!-- Main Card Container -->
    <main class="relative z-10 px-6 py-12 text-center flex flex-col items-center justify-center">

        <!-- Interactive Title Card -->
        <div class="animate-float cursor-default group transition-transform duration-500 hover:scale-105">
            <h1 class="text-8xl sm:text-9xl md:text-[13rem] font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 glow-effect transition-all duration-700 group-hover:from-indigo-300 group-hover:to-purple-300">
                adi
            </h1>
        </div>

        <!-- Minimal Subtitle / Greeting -->
        <p class="mt-4 text-slate-400 text-lg sm:text-xl font-light tracking-widest uppercase opacity-80 hover:opacity-100 transition-opacity duration-300">
            Welcome • Hello World
        </p>

        <!-- Interactive Glow Accent Button -->
        <div class="mt-10">
            <button id="sparkleBtn" onclick="togglePulse()" class="relative group px-8 py-3.5 rounded-full bg-slate-900/80 border border-slate-700/60 hover:border-indigo-500/50 text-sm font-medium text-slate-300 hover:text-white backdrop-blur-md transition-all duration-300 hover:shadow-[0_0_25px_rgba(99,102,241,0.3)] active:scale-95">
                <span class="flex items-center space-x-2">
                    <span id="btnDot" class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    <span id="btnText">Say Hi</span>
                </span>
            </button>
        </div>

        <!-- Interactive Toast Message -->
        <div id="toast" class="fixed bottom-8 opacity-0 translate-y-4 pointer-events-none transition-all duration-500 bg-slate-900/90 border border-indigo-500/40 text-indigo-200 px-6 py-3 rounded-full text-sm font-medium shadow-2xl backdrop-blur-md">
            Hello I'm Adi! I'm super duper gay and I want a hubby!
        </div>

    </main>

    <script>
        function togglePulse() {
            const toast = document.getElementById('toast');
            const btnText = document.getElementById('btnText');

            // Show toast message
            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            btnText.textContent = "Hi there!";

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                btnText.textContent = "Say Hi";
            }, 3000);
        }
    </script>
</body>
</html>
